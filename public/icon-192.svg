<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e6f" />
      <stop offset="60%" stop-color="#0d3a54" />
      <stop offset="100%" stop-color="#082436" />
    </linearGradient>
  </defs>

  <!-- Background App Icon Badge -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Ambient Subtle Grid -->
  <g stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.2">
    <line x1="10" y1="20" x2="90" y2="20" stroke-dasharray="2 3" />
    <line x1="10" y1="50" x2="90" y2="50" stroke-dasharray="2 3" />
    <line x1="10" y1="80" x2="90" y2="80" stroke-dasharray="2 3" />
    <line x1="20" y1="10" x2="20" y2="90" stroke-dasharray="2 3" />
    <line x1="50" y1="10" x2="50" y2="90" stroke-dasharray="2 3" />
    <line x1="80" y1="10" x2="80" y2="90" stroke-dasharray="2 3" />
  </g>

  <!-- PROMINENT GOLDEN "Z" ROAD TRACK -->
  <path
    d="M 22 22 L 78 22 L 22 78 L 78 78"
    stroke="#F5B82E"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.25"
  />

  <path
    d="M 22 22 L 78 22 L 22 78 L 78 78"
    stroke="#F5B82E"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <path
    d="M 24 22 L 76 22 L 24 78 L 76 78"
    stroke="#FFFFFF"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="3 3"
    stroke-opacity="0.85"
  />

  <!-- Network Location Nodes on the Z-Corners -->
  <circle cx="22" cy="22" r="4" fill="#082436" stroke="#F5B82E" stroke-width="2" />
  <circle cx="22" cy="22" r="1.8" fill="#38bdf8" />

  <circle cx="78" cy="22" r="4" fill="#082436" stroke="#F5B82E" stroke-width="2" />
  <circle cx="78" cy="22" r="1.8" fill="#38bdf8" />

  <circle cx="22" cy="78" r="4" fill="#082436" stroke="#F5B82E" stroke-width="2" />
  <circle cx="22" cy="78" r="1.8" fill="#38bdf8" />

  <circle cx="78" cy="78" r="4" fill="#082436" stroke="#F5B82E" stroke-width="2" />
  <circle cx="78" cy="78" r="1.8" fill="#38bdf8" />

  <!-- Blue Location Map Pin over Top-Right Node -->
  <g transform="translate(73, 9) scale(0.55)">
    <path d="M6 0C2.68 0 0 2.68 0 6C0 10.5 6 16 6 16C6 16 12 10.5 12 6C12 2.68 9.32 0 6 0Z" fill="#38bdf8" />
    <circle cx="6" cy="6" r="2.2" fill="#0c4a6e" />
  </g>

  <!-- TOP-DOWN SPEED CAR MOVING ALONG THE "Z" DIAGONAL -->
  <g transform="translate(48, 52) rotate(45)">
    <line x1="-12" y1="-4" x2="-12" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round" />
    <line x1="0" y1="6" x2="0" y2="24" stroke="#F5B82E" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round" />
    <line x1="12" y1="-4" x2="12" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round" />

    <rect x="-8" y="-15" width="16" height="30" rx="5" fill="#04121c" opacity="0.6" transform="translate(1.5, 2)" />
    <rect x="-8" y="-15" width="16" height="30" rx="5" fill="#38bdf8" />
    <rect x="-6.5" y="-13" width="13" height="26" rx="3.5" fill="#0284c7" />

    <rect x="-5" y="-6" width="10" height="12" rx="2" fill="#e0f2fe" />
    <path d="M -5.5 -7 L 5.5 -7 L 4.5 -11 L -4.5 -11 Z" fill="#0c4a6e" />
    <path d="M -5 7 L 5 7 L 4.5 9.5 L -4.5 9.5 Z" fill="#0c4a6e" />

    <circle cx="-5.5" cy="-14" r="1.3" fill="#fef08a" />
    <circle cx="5.5" cy="-14" r="1.3" fill="#fef08a" />

    <rect x="-6" y="13.5" width="2.5" height="1.2" rx="0.5" fill="#ef4444" />
    <rect x="3.5" y="13.5" width="2.5" height="1.2" rx="0.5" fill="#ef4444" />
  </g>
</svg>
