<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ridezwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / App Icon Container -->
  <rect width="512" height="512" rx="110" fill="url(#ridezwGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />

  <!-- Zimbabwe National Accent Bar -->
  <g transform="translate(196, 56)">
    <rect x="0" y="0" width="120" height="6" rx="3" fill="#008000" />
    <rect x="0" y="8" width="120" height="6" rx="3" fill="#ffd700" />
    <rect x="0" y="16" width="120" height="6" rx="3" fill="#d40000" />
    <rect x="0" y="24" width="120" height="6" rx="3" fill="#000000" />
  </g>

  <!-- Center Vehicle & Fast Forward / E-Hailing Symbol -->
  <g transform="translate(106, 120)" filter="url(#glow)">
    <!-- Main Car Body Silhouette -->
    <path d="M70 160 L100 80 C108 58, 128 44, 152 44 L228 44 C252 44, 272 58, 280 80 L310 160 C332 165, 348 185, 348 208 L348 240 C348 252, 338 262, 326 262 L320 262 L320 290 C320 304, 308 316, 294 316 L274 316 C260 316, 248 304, 248 290 L248 262 L132 262 L132 290 C132 304, 120 316, 106 316 L86 316 C72 316, 60 304, 60 290 L60 262 L54 262 C42 262, 32 252, 32 240 L32 208 C32 185, 48 165, 70 160 Z" fill="url(#goldGrad)" />
    
    <!-- Windshield -->
    <path d="M108 150 L128 92 C132 80, 144 72, 158 72 L222 72 C236 72, 248 80, 252 92 L272 150 Z" fill="#082f49" />
    
    <!-- Headlights -->
    <circle cx="78" cy="208" r="16" fill="#ffffff" />
    <circle cx="302" cy="208" r="16" fill="#ffffff" />
    
    <!-- Grille Accent Line -->
    <rect x="135" y="218" width="110" height="12" rx="6" fill="#082f49" opacity="0.6" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="445" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="4">
    RIDE<tspan fill="#f59e0b">ZW</tspan>
  </text>
  <text x="256" y="475" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="6">
    YOUR RIDE, ANYTIME
  </text>
</svg>
